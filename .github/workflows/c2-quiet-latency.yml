name: C2 Dedicated Quiet Latency

on:
  workflow_dispatch:
  push:
    branches: [perf/append-storage-bounded-writes]
    paths:
      - .github/workflows/c2-quiet-latency.yml
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - crates/sockudo-core/src/version_store/**
      - crates/sockudo-core/examples/c2_append_storage.rs
      - crates/sockudo-server/src/history/**
      - audits/performance-2026-09-05/c2/**
      - audits/performance-2026-09-05/c2-followup/remote/**
      - audits/performance-2026-09-05/c2-followup/source-snapshots/c2-final-from-baseline.patch

permissions:
  contents: read

concurrency:
  group: c2-dedicated-quiet-latency-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same compiler for all source versions. No floating stable channel or target cache.
  C2_RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: never

jobs:
  build:
    if: github.repository == 'sockudo/sockudo'
    name: Build ${{ matrix.phase }} benchmark artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, c2, followup]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.C2_RUST_VERSION }}
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev cmake protobuf-compiler libprotobuf-dev clang
      - name: Test portable benchmark support
        run: |
          python3 -m unittest discover -s audits/performance-2026-09-05/c2 -p 'test_*.py'
          python3 -m unittest discover -s audits/performance-2026-09-05/c2-followup/remote -p 'test_*.py'
      - name: Build source without running benchmarks
        timeout-minutes: 155
        env:
          PHASE: ${{ matrix.phase }}
        run: python3 audits/performance-2026-09-05/c2-followup/remote/build.py "$PHASE" "$RUNNER_TEMP/c2-build"
      - name: Retain source, compiler, binary and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c2-build-${{ matrix.phase }}-${{ github.sha }}
          path: ${{ runner.temp }}/c2-build/artifacts/
          retention-days: 30
          if-no-files-found: error

  measure:
    name: Three interleaved repetitions on one fresh VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: c2-build-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/c2-artifacts/baseline
      - uses: actions/download-artifact@v8
        with:
          name: c2-build-c2-${{ github.sha }}
          path: ${{ runner.temp }}/c2-artifacts/c2
      - uses: actions/download-artifact@v8
        with:
          name: c2-build-followup-${{ github.sha }}
          path: ${{ runner.temp }}/c2-artifacts/followup
      - name: Measure with original quiet gates and reject Linux CPU steal
        timeout-minutes: 155
        run: |
          python3 audits/performance-2026-09-05/c2-followup/remote/measure.py \
            "$RUNNER_TEMP/c2-artifacts" "$RUNNER_TEMP/c2-results"
      - name: Retain every accepted and rejected attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c2-quiet-latency-${{ github.sha }}
          path: ${{ runner.temp }}/c2-results/
          retention-days: 30
          if-no-files-found: error
      - name: Stop only this job's fixture containers
        if: always()
        run: docker compose -p sockudo-c2-append-storage -f audits/performance-2026-09-05/c2/compose.yaml down
